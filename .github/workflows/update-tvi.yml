name: Update TVI

on:
  schedule:
    - cron: "0 12 * * *"   # every day ~7-8am New York time (after last night's games)
  workflow_dispatch:        # adds a "Run workflow" button for manual runs

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tvi.py
      - name: Save results
        run: |
          git config user.name "tvi-bot"
          git config user.email "tvi-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "TVI update $(date -u +%F)"
          git push
